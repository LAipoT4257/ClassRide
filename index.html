
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3ebdd">

    <title>ClassRide — Travel Together</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>ClassRide</h1>
            <p>Travel together. Make every journey easier.</p>
        </header>

        <!-- Authentication Section -->
        <section id="auth-section" class="auth-section">

            <div class="auth-card">

                <h2>Create an Account</h2>
                <p class="form-description">
                    Join ClassRide and travel together.
                </p>

                <form id="register-form">

                    <label for="register-name">Full Name</label>
                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your full name"
                        required
                    >

                    <label for="register-email">Email Address</label>
                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button type="submit" class="primary-button">
                        Create Account
                    </button>

                </form>

                <p id="register-message" class="message"></p>

            </div>

            <div class="auth-card">

                <h2>Welcome Back</h2>
                <p class="form-description">
                    Log in to your ClassRide account.
                </p>

                <form id="login-form">

                    <label for="login-email">Email Address</label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="primary-button">
                        Log In
                    </button>

                </form>

                <p id="login-message" class="message"></p>

            </div>

        </section>

        <!-- Logged-in Account Section -->
        <section id="account-section" class="account-card" hidden>

            <h2>Welcome to ClassRide!</h2>

            <p id="account-name"></p>
            <p id="account-email"></p>

            <button id="logout-button" class="secondary-button">
                Log Out
            </button>

        </section>

        <footer>
            <p>ClassRide &copy; 2026</p>
        </footer>

    </main>

    <script type="module" src="./js/script.js"></script>

</body>
</html>
